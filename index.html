<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABHT — Cartographie & Coordonnées</title>
<style>
:root{
  --bg:#eef2f6;--surface:#ffffff;--surface2:#f7f9fc;--line:#dce3eb;
  --text:#17212b;--muted:#6b7785;--accent:#1769aa;--accent2:#0f568f;
  --green:#16794b;--red:#c62828;--orange:#b56700;--shadow:0 8px 24px rgba(31,48,64,.08)
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
.app{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr);overflow:hidden}
.top{height:58px;background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;white-space:nowrap;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:16px;margin-left:auto;min-width:max-content}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1769aa,#0e4d7c);color:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 4px 12px rgba(23,105,170,.22)}
.brand small{display:block;color:var(--muted);font-weight:600;font-size:10px;margin-top:1px}
.api{display:flex;align-items:center;gap:7px;min-width:0}
.api input{height:38px;border:1px solid #cbd5df;border-radius:9px;padding:0 10px;background:#fff;outline:none;transition:.15s}
#apiKey{width:min(270px,24vw)}#mapId{width:min(170px,15vw)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,105,170,.10)}
button{height:38px;border:1px solid transparent;border-radius:9px;padding:0 13px;cursor:pointer;font-weight:800;transition:.15s}
button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}
.secondary{background:#fff;border-color:#c8d2dc;color:#324252}.danger{background:#fff;border-color:#efc2bf;color:var(--red)}
.iconbtn{width:34px;height:34px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:#fff;color:#344454;border-radius:9px}
.main{min-height:0;display:grid;grid-template-columns:410px minmax(0,1fr);overflow:hidden}
.side{min-height:0;background:#f8fafc;border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px;box-shadow:0 2px 8px rgba(37,56,75,.035)}
.card h2{font-size:13px;margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 .sub{font-size:10px;color:var(--muted);font-weight:600}
.coord-block{display:grid;grid-template-columns:72px 1fr 1fr;gap:7px;align-items:end;margin-bottom:7px}
.coord-title{font-size:10px;font-weight:900;color:#596675;padding-bottom:11px;line-height:1.15}
.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 3px;font-weight:700}
.field input{width:100%;height:36px;border:1px solid #ccd6df;border-radius:8px;padding:0 9px;background:#fff;outline:none;direction:ltr;text-align:left;font-size:12px}
.actions{display:flex;gap:7px;align-items:center;margin-top:7px}.actions button{height:35px;font-size:11px;flex:1}
.msg{font-size:10px;margin-top:5px;min-height:14px;line-height:1.35}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--orange)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.res{min-width:0;border:1px solid #e3e8ee;border-radius:9px;padding:7px 8px;background:var(--surface2)}
.res b{display:block;font-size:9px;letter-spacing:.2px;color:var(--muted);margin-bottom:2px}.res span{display:block;font-weight:800;font-size:11.5px;line-height:1.35;word-break:break-word;max-height:32px;overflow:hidden}.res.wide{grid-column:1/-1}.point{font-family:Consolas,monospace;direction:ltr;text-align:left;font-size:10.5px!important}
.side-footer{margin-top:auto;display:flex;gap:7px}.side-footer button{flex:1;height:35px;font-size:11px}.count{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:#e8f1f8;color:var(--accent);font-size:10px;margin-right:4px}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:#e8edf2}.map{position:absolute;inset:0}.placeholder{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#e9edf2,#f5f7f9);color:#576472;text-align:center;padding:30px;z-index:5}.placeholder.hidden{display:none}
.history-drawer{position:absolute;top:12px;right:12px;width:min(390px,calc(100% - 24px));max-height:calc(100% - 24px);background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 42px rgba(27,42,56,.18);z-index:15;display:none;overflow:hidden}.history-drawer.open{display:grid;grid-template-rows:auto minmax(0,1fr) auto}.drawer-head{height:48px;padding:0 10px 0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}.drawer-head strong{font-size:13px;margin-left:auto}.history{padding:9px;display:grid;gap:6px;overflow:auto;overscroll-behavior:contain}.hist{border:1px solid #e1e6ec;border-radius:10px;padding:7px 8px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.hist strong{font-size:11px;display:block}.hist small{display:block;color:var(--muted);font-size:9px;direction:ltr;text-align:left;margin-top:2px}.hist button{height:29px;padding:0 8px;font-size:10px}.drawer-foot{padding:8px;border-top:1px solid var(--line);display:flex;gap:7px}.drawer-foot button{width:100%;height:34px;font-size:10px}
.status{font-size:10px;color:var(--muted);line-height:1.4}
@media(max-height:760px){.app{grid-template-rows:52px minmax(0,1fr)}.top{height:52px;padding:6px 10px}.brand-mark{width:31px;height:31px}.api input,button{height:35px}.side{padding:8px;gap:6px}.card{padding:8px}.card h2{margin-bottom:6px}.coord-block{margin-bottom:5px}.field input{height:32px}.actions{margin-top:5px}.actions button,.side-footer button{height:32px}.res{padding:5px 7px}.msg{margin-top:3px;min-height:12px}}
@media(max-width:1050px){.main{grid-template-columns:365px minmax(0,1fr)}.side{padding:7px}.brand small{display:none}#apiKey{width:190px}#mapId{width:120px}}
@media(max-width:780px){.main{grid-template-columns:330px minmax(0,1fr)}#mapId{display:none}.brand span:last-child{display:none}.coord-block{grid-template-columns:58px 1fr 1fr}.results{gap:4px}.res{padding:5px}}

:root{
  --bg:#11161c;
  --surface:#1a2027;
  --surface2:#202831;
  --line:#303a45;
  --text:#e7edf3;
  --muted:#9aa7b4;
  --accent:#4a90c8;
  --accent2:#397fb8;
  --green:#45b97c;
  --red:#ff7474;
  --orange:#e6a64b;
  --shadow:0 10px 28px rgba(0,0,0,.28)
}
body{background:var(--bg);color:var(--text)}
.top{background:rgba(22,27,33,.98);border-bottom-color:var(--line);box-shadow:0 4px 18px rgba(0,0,0,.16)}
.brand-mark{background:linear-gradient(135deg,#367fb8,#245d88);box-shadow:0 4px 12px rgba(0,0,0,.28)}
.api input,.field input{
  background:#141a20;
  border-color:#394450;
  color:var(--text);
  caret-color:#8fc7f2;
}
.api input::placeholder,.field input::placeholder{color:#6f7c89}
input:focus{border-color:#5aa4dc;box-shadow:0 0 0 3px rgba(74,144,200,.18)}
.secondary,.danger,.iconbtn{
  background:#202831;
  border-color:#3a4652;
  color:#d9e3eb;
}
.secondary:hover,.iconbtn:hover{background:#27323d;border-color:#4b5b69}
.danger:hover{background:#2c2426;border-color:#6b4549;color:#ff9090}
.side{background:#141a20;border-left-color:var(--line)}
.card{background:var(--surface);border-color:var(--line);box-shadow:0 3px 12px rgba(0,0,0,.18)}
.coord-title{color:#a7b2bd}
.res{border-color:#313b46;background:var(--surface2)}
.count{background:#263746;color:#7db9e7}
.mapwrap{background:#11161c}
.placeholder{background:linear-gradient(135deg,#171d24,#222b34);color:#9eabb7}
.history-drawer{background:rgba(25,31,38,.985);border-color:var(--line);box-shadow:0 18px 48px rgba(0,0,0,.42)}
.drawer-head,.drawer-foot{border-color:var(--line);background:#181f26}
.history{background:#151b21}
.hist{border-color:#303b46;background:#202831}
.hist button{background:#27323d;border-color:#3c4956;color:#dce6ee}

input{color-scheme:dark}

.gm-style .gm-style-iw-c{
  background:#1a2027!important;
  color:#e7edf3!important;
  border:1px solid #3b4652!important;
  border-radius:12px!important;
  box-shadow:0 12px 34px rgba(0,0,0,.38)!important;
  padding:0!important;
}
.gm-style .gm-style-iw-d{
  background:#1a2027!important;
  color:#e7edf3!important;
  overflow:auto!important;
  padding:0!important;
}
.gm-style .gm-style-iw-tc::after{background:#1a2027!important}
.gm-style .gm-ui-hover-effect{
  filter:invert(1) grayscale(1);
  opacity:.78!important;
}
.abht-info{
  min-width:230px;
  padding:14px 16px 12px;
  color:#e7edf3!important;
  background:#1a2027;
  font-family:Arial,"Segoe UI",Tahoma,sans-serif;
  font-size:13px;
  line-height:1.55;
}
.abht-info b{color:#f5f8fb}
.abht-info .info-muted{color:#aab6c2}
.abht-info .info-sep{border:0;border-top:1px solid #38434e;margin:9px 0}

.mapwrap.a4-capture-map{
  position:fixed!important;
  left:50%!important;
  top:50%!important;
  right:auto!important;
  bottom:auto!important;
  transform:translate(-50%,-50%)!important;
  width:min(100vw,141.451613vh)!important;
  height:min(100vh,70.695553vw)!important;
  min-width:0!important;
  min-height:0!important;
  max-width:none!important;
  max-height:none!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  border-radius:0!important;
  z-index:10000!important;
  overflow:hidden!important;
}
.mapwrap.a4-capture-map .history-drawer{display:none!important}

.shot-tools{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:grid;gap:6px}
.shot-row{display:grid;grid-template-columns:1fr;gap:6px}
.shot-field input{height:32px}
.shot-actions{margin:0}.shot-actions button{height:32px;font-size:10.5px}
.capture-overlay{position:absolute;inset:0;display:none;pointer-events:none;z-index:14}
.capture-overlay.show{display:block}
.capture-badge.empty{display:none}
.capture-badge{position:absolute;top:16px;left:16px;max-width:calc(100% - 32px);padding:9px 14px;border-radius:14px;background:rgba(12,17,22,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.24);color:#f4f8fb;font-weight:900;font-size:18px;letter-spacing:.3px}
.capture-meta{position:absolute;right:16px;bottom:16px;max-width:min(440px,calc(100% - 32px));padding:10px 12px;border-radius:14px;background:rgba(12,17,22,.82);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 24px rgba(0,0,0,.24);color:#eef4f8;font-size:12px;line-height:1.45;text-align:right}
.capture-meta strong{display:block;font-size:13px;margin-bottom:4px;color:#fff}
.capture-meta .meta-sub{color:#b6c3ce}
.capture-meta .meta-inline{display:block;direction:ltr;text-align:left;margin-top:5px;font-family:Consolas,monospace;color:#d4e0e8}
@media(max-width:980px){.capture-badge{font-size:16px}.capture-meta{font-size:11px}}

.map-pick{width:100%;margin-top:6px;background:#202831;border:1px solid #3a4652;color:#d9e3eb}
.map-pick:hover{background:#27323d;border-color:#4b5b69}
.map-pick.active{background:#1769aa;border-color:#5aa4dc;color:#fff;box-shadow:0 0 0 3px rgba(74,144,200,.16)}

.api select{height:38px;border:1px solid #394450;border-radius:9px;padding:0 34px 0 10px;background:#141a20;color:var(--text);outline:none;font:inherit;font-weight:800;color-scheme:dark}
.api select:focus{border-color:#5aa4dc;box-shadow:0 0 0 3px rgba(74,144,200,.18)}
#mapProvider{width:145px}
#appleToken{width:min(410px,34vw)}
body[data-provider="google"] .provider-apple{display:none!important}
body[data-provider="apple"] .provider-google{display:none!important}
@media(max-width:1150px){#mapProvider{width:125px}#appleToken{width:260px}}

.results .point{font-size:12px!important;max-height:none;white-space:normal;overflow-wrap:anywhere}
</style>
</head>
<body data-provider="google">
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">ABHT</div>
      <span>Cartographie & Coordonnées<small>إحداثيات WGS84 / Lambert</small></span>
    </div>
    <div class="api">
      <select id="mapProvider" aria-label="Map provider">
        <option value="google">Google Maps</option>
        <option value="apple">Apple Maps</option>
      </select>
      <button id="loadMap" class="primary">تشغيل الخريطة</button>
    </div>
  </header>

  <div class="main">
    <aside class="side">
      <section class="card">
        <h2><span>إضافة نقطة</span><span class="sub">WGS84 أو Lambert</span></h2>
        <div class="coord-block">
          <div class="coord-title">WGS84</div>
          <div class="field"><label for="lon">Longitude</label><input id="lon" inputmode="decimal" placeholder="-8.028881"></div>
          <div class="field"><label for="lat">Latitude</label><input id="lat" inputmode="decimal" placeholder="31.465106"></div>
        </div>
        <div class="coord-block">
          <div class="coord-title">Lambert</div>
          <div class="field"><label for="x">X</label><input id="x" inputmode="decimal" placeholder="250000"></div>
          <div class="field"><label for="y">Y</label><input id="y" inputmode="decimal" placeholder="100000"></div>
        </div>
        <div class="actions">
          <button id="addPoint" class="primary" disabled>إضافة النقطة</button>
          <button id="clearInputs" class="secondary">مسح</button>
        </div>
        <button id="pickMapPoint" class="map-pick" type="button" disabled>اختيار نقطة من الخريطة</button>
        <div id="inputMsg" class="msg" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2><span>إحداثيات آخر نقطة</span><span class="sub">WGS84 / Lambert</span></h2>
        <div class="results">
          <div class="res"><b>LONGITUDE / LATITUDE</b><span id="point" class="point">—</span></div>
          <div class="res"><b>LAMBERT X / Y</b><span id="lambertResult" class="point">—</span></div>
        </div>
        <div class="shot-tools">
          <div class="shot-row">
            <div class="field shot-field"><label for="pointNumber">رقم النقطة داخل الصورة</label><input id="pointNumber" inputmode="numeric" placeholder="مثال: 12"></div>
          </div>
          <div class="actions shot-actions">
            <button id="captureBtn" class="primary" type="button">Screenshot</button>
          </div>
          <div id="shotMsg" class="msg" aria-live="polite"></div>
        </div>
      </section>

<div class="side-footer">
        <button id="historyToggle" class="secondary">النقط المسجلة <span id="historyCount" class="count">0</span></button>
      </div>
    </aside>

    <div class="mapwrap">
      <div id="placeholder" class="placeholder">الخريطة</div>
      <div id="map" class="map" aria-label="Interactive Map"></div>
      <div id="captureOverlay" class="capture-overlay" aria-hidden="true">
        <div id="captureBadge" class="capture-badge">POINT</div>
      </div>
      <aside id="historyDrawer" class="history-drawer" aria-hidden="true">
        <div class="drawer-head"><strong>النقط المسجلة</strong><button id="closeHistory" class="iconbtn" type="button">✕</button></div>
        <div id="history" class="history"><div class="status">مازال ما تسجلات حتى نقطة.</div></div>
        <div class="drawer-foot"><button id="clearPoints" class="danger" disabled>حذف جميع النقط</button></div>
      </aside>
    </div>
  </div>
</div>
<script>
/*
  إعدادات الخرائط: ضع المفاتيح هنا فقط؛ لا تُعرض أي خانة مفاتيح للمستخدم.
  ملاحظة: في HTML يعمل بالمتصفح، تبقى هذه القيم قابلة للاطلاع من كود المصدر.
  قيّد Google Maps API Key بنطاق الموقع وMaps JavaScript API من Google Cloud.
  لم يتم تضمين مفاتيح حقيقية لأن الملف الأصلي لا يحتوي عليها.
*/
const MAP_CONFIG = Object.freeze({
  googleMapsApiKey: '', // ضع Google Maps API Key بين علامتي الاقتباس
  googleMapId: 'DEMO_MAP_ID', // عوّضه بـ Map ID حقيقي إن توفر
  appleMapKitToken: '' // ضع Apple MapKit JS Token بين علامتي الاقتباس
});
// توافق اختياري مع المفاتيح التي سبق إدخالها في النسخة القديمة على نفس المتصفح والموقع.
const STORAGE_KEY='abht_google_maps_api_key_v1';
const STORAGE_MAP_ID='abht_google_maps_map_id_v1';
const STORAGE_APPLE_TOKEN='abht_apple_mapkit_token_v1';
function configuredMapValue(value, storageKey){
  if(String(value||'').trim())return String(value).trim();
  try{return localStorage.getItem(storageKey)||''}catch{return ''}
}
const STORAGE_PROVIDER='abht_map_provider_v1';
const STORAGE_POINTS='abht_google_maps_points_v1';
let activeProvider='google';
let map=null, AdvancedMarkerElement=null, PinElement=null, infoWindow=null;
let markers=[];
let savedPoints=[];

function $(id){return document.getElementById(id)}
function parseNum(v){return Number(String(v).trim().replace(',','.'))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function lambertToWgs(x,y){const u=x/100000,v=y/100000;const f=[1,u,v,u*u,u*v,v*v,u*u*u,u*u*v,u*v*v,v*v*v];const clo=[-10.6035903,1.03929408,-0.0518712066,0.000522839549,0.0103323491,-0.000522551006,-0.000035380674,0.0000096331137,0.000106100354,-0.00000320791744];const cla=[30.4795447,0.0449302414,0.900165751,-0.00448458237,0.000474701576,0.000268740621,-0.00000143103283,-0.0000474178412,-0.000000450206303,-0.0000365654964];let lon=0,lat=0;for(let i=0;i<f.length;i++){lon+=f[i]*clo[i];lat+=f[i]*cla[i]}return [lon,lat]}

function wgsToLambert(lon,lat){let x=(lon+10.6035903)/1.04*100000,y=(lat-30.4795447)/0.90*100000;for(let i=0;i<12;i++){const p=lambertToWgs(x,y),eLon=lon-p[0],eLat=lat-p[1];if(Math.abs(eLon)+Math.abs(eLat)<1e-11)break;const h=10,px=lambertToWgs(x+h,y),py=lambertToWgs(x,y+h);const a=(px[0]-p[0])/h,b=(py[0]-p[0])/h,c=(px[1]-p[1])/h,d=(py[1]-p[1])/h,det=a*d-b*c;if(Math.abs(det)<1e-15)break;const dx=(eLon*d-b*eLat)/det,dy=(a*eLat-eLon*c)/det;x+=dx;y+=dy;if(!Number.isFinite(x)||!Number.isFinite(y))break}return [x,y]}
async function initGoogleMap(){
  try{
    activeProvider='google';
    const {Map}=await google.maps.importLibrary('maps');
    const markerLib=await google.maps.importLibrary('marker');
    AdvancedMarkerElement=markerLib.AdvancedMarkerElement;PinElement=markerLib.PinElement;
    const mapId=configuredMapValue(MAP_CONFIG.googleMapId,STORAGE_MAP_ID)||'DEMO_MAP_ID';
    map=new Map($('map'),{center:{lat:31.63,lng:-8.0},zoom:8,mapId,mapTypeId:'roadmap',mapTypeControl:true,streetViewControl:false,fullscreenControl:true,gestureHandling:'greedy'});
    infoWindow=new google.maps.InfoWindow();

    $('placeholder').classList.add('hidden');$('addPoint').disabled=false;$('pickMapPoint').disabled=false;
    map.addListener('click',e=>{if(!e.latLng)return;handleMapInteraction(e.latLng.lng(),e.latLng.lat())});
    restorePoints();
    $('inputMsg').textContent='Google Maps جاهزة.';$('inputMsg').className='msg ok';
  }catch(e){console.error(e);$('inputMsg').textContent='تعذر تشغيل Google Maps: '+(e.message||e);$('inputMsg').className='msg bad'}
}
window.__abhtGoogleInit=()=>{initGoogleMap()};
function loadGoogleMaps(){
  if(map){return}
  const key=configuredMapValue(MAP_CONFIG.googleMapsApiKey,STORAGE_KEY);
  if(!key){$('inputMsg').textContent='Google Maps API Key غير محدد. أضفه داخل MAP_CONFIG في الكود.';$('inputMsg').className='msg bad';return}
  $('loadMap').disabled=true;$('inputMsg').textContent='جاري تحميل Google Maps…';$('inputMsg').className='msg';
  const s=document.createElement('script');s.async=true;s.defer=true;s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&loading=async&libraries=marker&callback=__abhtGoogleInit&v=weekly';
  s.onerror=()=>{$('loadMap').disabled=false;$('inputMsg').textContent='فشل تحميل Google Maps. تحقق من API Key والإنترنت.';$('inputMsg').className='msg bad'};
  document.head.appendChild(s);
}

function appleMapKitError(status){
  const st=String(status||'Unknown');
  if(/Unauthorized|Bad Request|401/i.test(st))return new Error('Apple Maps: Token غير صالح أو غير مسموح له بهاد Origin ( '+location.origin+' ). راجع MapKit JS Token وDomain Restrictions فـApple Developer. الحالة: '+st);
  if(/Too Many Requests/i.test(st))return new Error('Apple Maps: تجاوزت الحصة المسموح بها للاستعمال. '+st);
  return new Error('Apple Maps: فشل الترخيص أو الاتصال بالخادم ('+st+'). راجع الـToken والاتصال بالإنترنت وConsole.');
}
async function loadAppleMapKit(token){
  if(!window.mapkit||typeof window.mapkit.init!=='function'){
    await new Promise((resolve,reject)=>{
      const old=document.getElementById('abhtAppleMapKitScript');if(old)old.remove();
      const sc=document.createElement('script');sc.id='abhtAppleMapKitScript';
      sc.src='https://cdn.apple-mapkit.com/mk/6/mapkit.core.js';sc.crossOrigin='anonymous';sc.async=true;
      let finished=false;
      const timer=setTimeout(()=>settle(new Error('انتهت مهلة تحميل مكتبة Apple Maps. راجع اتصال الإنترنت.')),20000);
      function settle(err){if(finished)return;finished=true;clearTimeout(timer);err?reject(err):resolve()}
      sc.onload=()=>settle();sc.onerror=()=>settle(new Error('تعذر تحميل Apple MapKit JS من خوادم Apple.'));
      document.head.appendChild(sc);
    });
  }
  if(!window.mapkit||typeof window.mapkit.init!=='function')throw new Error('مكتبة Apple MapKit JS ما تهيّأتش بشكل صحيح.');
  await new Promise((resolve,reject)=>{
    let complete=false;
    const timeout=setTimeout(()=>done(new Error('Apple Maps ما جاوبتش على طلب الترخيص. تأكد من MapKit JS Token وOrigin وإعدادات Apple Developer.')),20000);
    const ready=e=>{if(e.status==='Initialized'||e.status==='Refreshed')done()};
    const failed=e=>done(appleMapKitError(e.status||e.message));
    function done(err){if(complete)return;complete=true;clearTimeout(timeout);mapkit.removeEventListener('configuration-change',ready);mapkit.removeEventListener('error',failed);err?reject(err):resolve()}
    mapkit.addEventListener('configuration-change',ready);
    mapkit.addEventListener('error',failed);
    try{mapkit.init({authorizationCallback:callback=>callback(token),language:'fr'})}
    catch(e){done(e)}
  });
  try{await mapkit.load(['map','annotations'])}
  catch(e){throw new Error('تعذر تحميل مكتبات Apple Maps (map, annotations): '+(e.message||e))}
  if(typeof mapkit.Map!=='function'||!mapkit.MarkerAnnotation)throw new Error('مكونات Apple Maps الأساسية ناقصة. أعد تحميل الصفحة.');
}

function saveDraggedPoint(p,lon,lat){
  if(!Number.isFinite(lon)||!Number.isFinite(lat)||lon<-180||lon>180||lat<-90||lat>90)return false;
  const [x,y]=wgsToLambert(lon,lat);
  if(!Number.isFinite(x)||!Number.isFinite(y))return false;
  p.lon=lon;p.lat=lat;p.x=x;p.y=y;
  localStorage.setItem(STORAGE_POINTS,JSON.stringify(savedPoints));
  $('lon').value=lon.toFixed(6);$('lat').value=lat.toFixed(6);
  $('x').value=x.toFixed(2);$('y').value=y.toFixed(2);
  coordInputMode='wgs';
  updateResult(p);renderHistory();
  $('inputMsg').textContent='تم تحريك النقطة وتحديث إحداثيات WGS84 وLambert وحفظ الموقع الجديد.';
  $('inputMsg').className='msg ok';

}
function createMarker(p,center=false){
  if(activeProvider==='google'){
    const pin=new PinElement({background:'#1769aa',borderColor:'#ffffff',glyphColor:'#ffffff',scale:1.05});
    const m=new AdvancedMarkerElement({map,position:{lat:p.lat,lng:p.lon},title:'نقطة',gmpClickable:true,gmpDraggable:true});
    m.append(pin);
    m.addEventListener('gmp-click',()=>{infoWindow.setContent(markerContent(p));infoWindow.open({map,anchor:m});updateResult(p)});
    m.addEventListener('gmp-dragstart',()=>{if(infoWindow)infoWindow.close()});
    m.addEventListener('gmp-dragend',()=>{
      const position=m.position;
      if(!position)return;
      const lat=typeof position.lat==='function'?position.lat():Number(position.lat);
      const lon=typeof position.lng==='function'?position.lng():Number(position.lng);
      if(!saveDraggedPoint(p,lon,lat)){
        m.position={lat:p.lat,lng:p.lon};
        $('inputMsg').textContent='تعذر حفظ موقع النقطة الجديد.';$('inputMsg').className='msg bad';
      }
    });

    if(center){map.panTo({lat:p.lat,lng:p.lon});if((map.getZoom()||0)<13)map.setZoom(13);infoWindow.setContent(markerContent(p));infoWindow.open({map,anchor:m})}
  }else{
    const ann=new mapkit.MarkerAnnotation(new mapkit.Coordinate(p.lat,p.lon),{title:'نقطة',subtitle:'X '+Number(p.x).toFixed(2)+' · Y '+Number(p.y).toFixed(2),color:'#1769aa',draggable:true});
    ann.addEventListener('drag-end',()=>{
      const c=ann.coordinate;

      if(saveDraggedPoint(p,c.longitude,c.latitude)){

      }else{
        ann.coordinate=new mapkit.Coordinate(p.lat,p.lon);
        $('inputMsg').textContent='تعذر حفظ موقع النقطة الجديد.';$('inputMsg').className='msg bad';
      }
    });

    if(center){map.region=new mapkit.CoordinateRegion(new mapkit.Coordinate(p.lat,p.lon),new mapkit.CoordinateSpan(.02,.025));try{ann.selected=true}catch{}updateResult(p)}
  }
}

function renderA4Landscape(sourceCanvas){
  const A4_W=3508,A4_H=2480;
  if(!sourceCanvas.width||!sourceCanvas.height)throw new Error('لم يتم التقاط صورة الخريطة.');
  const out=document.createElement('canvas');out.width=A4_W;out.height=A4_H;
  const ctx=out.getContext('2d',{alpha:false});
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  ctx.drawImage(sourceCanvas,0,0,sourceCanvas.width,sourceCanvas.height,0,0,A4_W,A4_H);
  return out;
}
let a4CaptureCenter=null;
function enterA4CaptureMode(){
  if(map){
    if(activeProvider==='google'){const c=map.getCenter();a4CaptureCenter=c?{lat:c.lat(),lng:c.lng()}:null}
    else{const r=map.region;a4CaptureCenter=r?{lat:r.center.latitude,lng:r.center.longitude,latSpan:r.span.latitudeDelta,lonSpan:r.span.longitudeDelta}:null}
  }
  document.querySelector('.mapwrap').classList.add('a4-capture-map');
  if(map){
    if(activeProvider==='google'){try{google.maps.event.trigger(map,'resize')}catch{};if(a4CaptureCenter)map.setCenter({lat:a4CaptureCenter.lat,lng:a4CaptureCenter.lng})}
    else if(a4CaptureCenter){map.region=new mapkit.CoordinateRegion(new mapkit.Coordinate(a4CaptureCenter.lat,a4CaptureCenter.lng),new mapkit.CoordinateSpan(a4CaptureCenter.latSpan,a4CaptureCenter.lonSpan))}
  }
}
function exitA4CaptureMode(){
  document.querySelector('.mapwrap').classList.remove('a4-capture-map');
  if(map&&a4CaptureCenter){
    if(activeProvider==='google'){try{google.maps.event.trigger(map,'resize')}catch{};map.setCenter({lat:a4CaptureCenter.lat,lng:a4CaptureCenter.lng})}
    else map.region=new mapkit.CoordinateRegion(new mapkit.Coordinate(a4CaptureCenter.lat,a4CaptureCenter.lng),new mapkit.CoordinateSpan(a4CaptureCenter.latSpan,a4CaptureCenter.lonSpan));
  }

async function captureWithDisplayMedia(p,pointNo){
  const openHistory=$('historyDrawer').classList.contains('open');
  if(openHistory)setHistoryOpen(false);

  let stream;
  try{
    stream=await navigator.mediaDevices.getDisplayMedia({
      video:{displaySurface:'browser',frameRate:{ideal:5,max:12},width:{ideal:1920},height:{ideal:1080}},
      audio:false,preferCurrentTab:true,selfBrowserSurface:'include',surfaceSwitching:'exclude'
    });
  }catch(err){if(openHistory)setHistoryOpen(true);throw err}
  let entered=false;
  try{
    const video=document.createElement('video');
    video.srcObject=stream;video.muted=true;video.playsInline=true;
    await video.play();
    enterA4CaptureMode();entered=true;

    await delay(1300);
    await delay(120);
    const rect=document.querySelector('.mapwrap').getBoundingClientRect();
    const frame=document.createElement('canvas');
    frame.width=video.videoWidth;frame.height=video.videoHeight;
    if(!frame.width||!frame.height)throw new Error('لم تصل صورة المشاركة من المتصفح.');
    frame.getContext('2d').drawImage(video,0,0,frame.width,frame.height);

    const sx=frame.width/window.innerWidth,sy=frame.height/window.innerHeight;
    const x1=Math.max(0,Math.min(frame.width,Math.round(rect.left*sx)));
    const y1=Math.max(0,Math.min(frame.height,Math.round(rect.top*sy)));
    const x2=Math.max(x1,Math.min(frame.width,Math.round(rect.right*sx)));
    const y2=Math.max(y1,Math.min(frame.height,Math.round(rect.bottom*sy)));
    const cw=x2-x1,ch=y2-y1;
    if(cw<100||ch<100)throw new Error('لم يتم تحديد مساحة الخريطة بشكل صحيح. اختر تبويب البرنامج نفسه.');
    const cropped=document.createElement('canvas');cropped.width=cw;cropped.height=ch;
    cropped.getContext('2d').drawImage(frame,x1,y1,cw,ch,0,0,cw,ch);
    const a4=renderA4Landscape(cropped);
    lastScreenshotDataUrl=a4.toDataURL('image/jpeg',0.94);
    lastScreenshotFilename=buildShotFilename(p,pointNo);
    downloadDataUrl(lastScreenshotDataUrl,lastScreenshotFilename);
  }finally{
    if(entered)exitA4CaptureMode();
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(openHistory)setHistoryOpen(true);
  }
}
async function captureScreenshot(){
  const p=activePoint();
  if(!map){setShotMsg('شغّل الخريطة أولاً.','bad');return}
  if(!p){setShotMsg('أضف نقطة قبل إنشاء Screenshot.','bad');return}
  const btn=$('captureBtn'),pointNo=$('pointNumber').value.trim();
  btn.disabled=true;
  hideMapCalloutsForCapture();
  showCaptureOverlay(p,pointNo);
  setShotMsg('جارٍ إنشاء الصورة A4 بدون هوامش…','');
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){
      setShotMsg('اختر تبويب البرنامج نفسه للمشاركة. سيتم حفظ JPG A4 تلقائياً.','warn');
      await captureWithDisplayMedia(p,pointNo);
    }else{
      setShotMsg('المتصفح لا يدعم مشاركة التبويب؛ سيتم استعمال HTML Capture.','warn');
      await captureWithHtml2Canvas(p,pointNo);
    }
    setShotMsg('تم حفظ Screenshot JPG بحجم A4 أفقي، والخريطة تملأ الصفحة كاملة.','ok');
  }catch(e){
    console.error(e);
    const denied=e&&String(e.name||'').includes('NotAllowed')?'تم إلغاء/رفض المشاركة من طرف المستخدم.':'تعذر إنشاء الصورة: '+(e.message||e);
    setShotMsg(denied,'bad');
  }finally{

    if(document.querySelector('.mapwrap').classList.contains('a4-capture-map'))exitA4CaptureMode();
    hideCaptureOverlay();
    restoreMapCalloutsAfterCapture();
    btn.disabled=false;
  }
}

$('loadMap').addEventListener('click',loadSelectedMap);
$('addPoint').addEventListener('click',addPoint);
$('pickMapPoint').addEventListener('click',()=>setMapPickMode(!mapPickMode));
$('clearInputs').addEventListener('click',()=>{setMapPickMode(false);$('lon').value='';$('lat').value='';$('x').value='';$('y').value='';$('inputMsg').textContent='';coordInputMode='lambert';$('lon').focus()});
$('clearPoints').addEventListener('click',clearPoints);
$('captureBtn').addEventListener('click',captureScreenshot);
function setHistoryOpen(open){const d=$('historyDrawer');d.classList.toggle('open',open);d.setAttribute('aria-hidden',open?'false':'true')}
$('historyToggle').addEventListener('click',()=>setHistoryOpen(!$('historyDrawer').classList.contains('open')));
$('closeHistory').addEventListener('click',()=>setHistoryOpen(false));
[$('lon'),$('lat')].forEach(el=>{el.addEventListener('input',()=>{coordInputMode='wgs'});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('addPoint').disabled)addPoint()})});
[$('x'),$('y')].forEach(el=>{el.addEventListener('input',()=>{coordInputMode='lambert'});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('addPoint').disabled)addPoint()})});
function syncProviderUi(){
  activeProvider=$('mapProvider').value||'google';document.body.dataset.provider=activeProvider;
  if(!map){$('inputMsg').textContent='';$('inputMsg').className='msg'}
  $('loadMap').textContent=activeProvider==='apple'?'تشغيل Apple Maps':'تشغيل Google Maps';
  $('placeholder').textContent='الخريطة';
}
$('mapProvider').addEventListener('change',()=>{try{localStorage.setItem(STORAGE_PROVIDER,$('mapProvider').value)}catch{};if(map){location.reload();return}syncProviderUi()});
try{
  $('mapProvider').value=localStorage.getItem(STORAGE_PROVIDER)||'google';
}catch{}
syncProviderUi();
